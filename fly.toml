# fly.toml app configuration file generated for openclaw-fly on 2026-02-07T11:51:33+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "openclaw-fly"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "openclaw_data"
  destination = "/data"

[env]
  PORT = "8080"
  SETUP_PASSWORD = "test"
  OPENCLAW_STATE_DIR = "/data/.openclaw"
  OPENCLAW_WORKSPACE_DIR = "/data/workspace"

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20
