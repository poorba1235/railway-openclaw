# fly.toml app configuration file generated for poorna-fly on 2026-02-07T11:58:32+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'poorna-fly'
primary_region = 'iad'

[build]

[env]
  OPENCLAW_STATE_DIR = '/data/.openclaw'
  OPENCLAW_WORKSPACE_DIR = '/data/workspace'
  PORT = '8080'
  SETUP_PASSWORD = 'test'

[[mounts]]
  source = 'openclaw_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
